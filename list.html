<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bacchae — Passages</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/style.css">
<style>
.app{max-width:760px;margin:0 auto;padding:4vh 6vw}
h1{font-size:1.35rem;font-weight:650;margin:0 0 2.5rem}
.section{margin:0 0 2rem}
.section-title{font-size:1rem;font-weight:650;margin:0 0 .65rem}
ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:.45rem .8rem}
li{margin:0}
a{color:inherit;text-decoration:none;border-bottom:1px solid #aaa;padding-bottom:1px}
a:hover,a:focus{border-bottom-color:#111}
.error{color:#900}
</style>
</head>
<body>
<div class="app">
<h1>Bacchae</h1>
<div id="contents"></div>
</div>
<script>
const PASSAGES_FILE="spijfliz456/bacchae-passages.json";
const SECTIONS_FILE="spijfliz456/bacchae-sections.json";
const contents=document.getElementById("contents");

function lineValue(value){
  const m=String(value??"").match(/^(\d+)([a-z]?)$/i);
  if(!m)return Infinity;
  return Number(m[1])*10+(m[2]?m[2].toLowerCase().charCodeAt(0)-96:0);
}

function findSection(sections,p){
  const start=lineValue(p.line_start);
  return sections
    .filter(s=>start>=lineValue(s.line_start)&&start<=lineValue(s.line_end))
    .sort((a,b)=>lineValue(b.line_start)-lineValue(a.line_start))[0]||null;
}

async function load(){
  const [pr,sr]=await Promise.all([fetch(PASSAGES_FILE),fetch(SECTIONS_FILE)]);
  if(!pr.ok||!sr.ok)throw new Error("Unable to load datasets.");
  const pd=await pr.json(), sd=await sr.json();
  const passages=pd.passages||[], sections=sd.sections||[];
  if(!passages.length)throw new Error("No passages found.");

  const groups=new Map();
  passages.forEach(p=>{
    const s=findSection(sections,p), key=s?s.section_id:"__unassigned__";
    if(!groups.has(key))groups.set(key,{title:s?s.section:"Other",start:lineValue(p.line_start),passages:[]});
    groups.get(key).passages.push(p);
  });

  [...groups.values()].sort((a,b)=>a.start-b.start).forEach(g=>{
    const section=document.createElement("section");
    section.className="section";
    const h=document.createElement("h2");
    h.className="section-title"; h.textContent=g.title;
    section.appendChild(h);
    const ul=document.createElement("ul");
    g.passages.sort((a,b)=>lineValue(a.line_start)-lineValue(b.line_start)).forEach(p=>{
      const li=document.createElement("li"), a=document.createElement("a");
      a.href="index.html?passage="+encodeURIComponent(p.passage_id);
      a.textContent=p.line_start+"–"+p.line_end;
      li.appendChild(a); ul.appendChild(li);
    });
    section.appendChild(ul); contents.appendChild(section);
  });
}
load().catch(e=>{console.error(e);contents.innerHTML='<p class="error">Unable to load the Bacchae passage list.</p>';});
</script>
</body>
</html>
