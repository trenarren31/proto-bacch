<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bacchae — Dataset-driven prototype</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<header class="header"><div class="play">Bacchae</div><div class="sep">·</div><div class="section"></div><div class="sep">·</div><div class="range"></div></header>
<main class="content"><section class="wrap"><div class="context"><div class="speaker"></div></div><div class="passage disable-interaction" id="passage"></div></section></main>
</div>
<aside class="panel" id="panel" aria-hidden="true"><header class="panel-head"><div class="selected-form" id="selectedForm"></div><button class="close" id="close" aria-label="Close annotation">×</button></header><div class="panel-body" id="annotation"></div></aside>
<script>
const DATA_FILES={
  text:"spijfliz456/bacchae-text.json",
  tokens:"spijfliz456/bacchae-tokens.json",
  speakers:"spijfliz456/bacchae-speakers.json",
  sections:"spijfliz456/bacchae-sections.json",
  passages:"spijfliz456/bacchae-passages.json"
};

// Passage selection: change this value for the default display.
// A URL parameter can override it without editing the file, e.g.
// index.html?passage=62-63
const DEFAULT_PASSAGE_ID="01-05";

const passage=document.getElementById("passage");
const panel=document.getElementById("panel");
const selectedForm=document.getElementById("selectedForm");
const annotation=document.getElementById("annotation");
let timer=null,suppress=false;

function parseLineRef(value){
  const text=String(value??"").trim();
  const match=text.match(/^(\d+)([a-z]?)$/i);
  if(!match)return null;
  const suffix=(match[2]||"").toLowerCase();
  const suffixOrder={"":0,a:1,b:2,c:3,d:4,e:5};
  return Number(match[1])*10+(suffixOrder[suffix]??0);
}
function inRange(line,start,end){
  const value=parseLineRef(line),low=parseLineRef(start),high=parseLineRef(end);
  return value!==null&&low!==null&&high!==null&&value>=low&&value<=high;
}
function findRangeRecord(records,line){
  return records.find(record=>inRange(line,record.line_start,record.line_end));
}
function features(t){
  if(/participle/i.test(t.pos_form||""))return[[t.pos_form,t.tense,t.voice].filter(Boolean).join(" · "),[t.number,t.gender,t.case].filter(Boolean).join(" · ")].filter(Boolean);
  if(/verb/i.test(t.pos||""))return[[t.pos_form,t.person_number,t.tense,t.mood,t.voice].filter(Boolean).join(" · ")].filter(Boolean);
  return[[t.pos_form,t.gender,t.number,t.case].filter(Boolean).join(" · ")].filter(Boolean);
}
function escapeHtml(value){return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}

function annotate(t){
  document.querySelectorAll(".annotated").forEach(x=>x.classList.remove("annotated"));
  document.querySelectorAll('[data-id="'+CSS.escape(t.token_id)+'"]').forEach(x=>x.classList.add("annotated"));
  selectedForm.innerHTML=escapeHtml(t.form)+(t.expanded_form?'<span class="expanded">('+escapeHtml(t.expanded_form)+')</span>':"");
  const featureLines=features(t).map(f=>'<div class="features">'+escapeHtml(f)+'</div>').join("");
  annotation.innerHTML='<div class="lemma">'+escapeHtml(t.lemma)+'</div>'+'<div class="gloss">'+escapeHtml(t.gloss)+'</div>'+'<hr class="annotation-divider">'+'<div class="details">'+(t.pos?'<div class="pos">'+escapeHtml(t.pos)+(t.pos_form?' · '+escapeHtml(t.pos_form):"")+'</div>':"")+featureLines+'</div>';
  panel.classList.add("open");panel.setAttribute("aria-hidden","false");
}

function tokenFragments(tokenId){
  return document.querySelectorAll('[data-id="'+CSS.escape(tokenId)+'"]');
}

function setTokenHighlight(tokenId, highlighted){
  tokenFragments(tokenId).forEach(fragment=>fragment.classList.toggle("highlighted",highlighted));
}

function bindTokenElement(span, token){
  span.className="token";
  span.dataset.id=token.token_id;
  span.addEventListener("click",()=>{
    if(suppress){suppress=false;return}
    const fragments=tokenFragments(token.token_id);
    const highlighted=Array.from(fragments).some(fragment=>fragment.classList.contains("highlighted"));
    setTokenHighlight(token.token_id,!highlighted);
  });
  span.addEventListener("pointerdown",event=>{if(event.pointerType==="mouse"&&event.button!==0)return;timer=setTimeout(()=>{suppress=true;annotate(token)},520)});
  ["pointerup","pointercancel","pointerleave"].forEach(eventName=>span.addEventListener(eventName,()=>clearTimeout(timer)));
}

function makeTokenSpan(text, token){
  const span=document.createElement("span");
  bindTokenElement(span,token);
  span.textContent=text;
  return span;
}

// Align tokens to the authoritative text. Most tokens occur wholly within
// one line, but an editorial line break can split a single linguistic token
// (e.g. Βάκ- / χιον). Such a token is represented by two DOM spans carrying
// the same token_id, so either visible fragment has the same interaction.
function buildTokenFragments(lines, tokens){
  const textByLine=new Map(lines.map(line=>[String(line.line),line.text||""]));
  const indexByLine=new Map(lines.map((line,i)=>[String(line.line),i]));
  const cursorByLine=new Map(lines.map(line=>[String(line.line),0]));
  const fragmentsByLine=new Map();

  function addFragment(lineKey,start,end,token){
    if(!fragmentsByLine.has(lineKey))fragmentsByLine.set(lineKey,[]);
    fragmentsByLine.get(lineKey).push({start,end,token});
  }

  tokens.forEach(token=>{
    const lineKey=String(token.line);
    if(!textByLine.has(lineKey))return;
    const form=String(token.form??"");
    const lineIndex=indexByLine.get(lineKey);
    let cursor=cursorByLine.get(lineKey)||0;
    const text=textByLine.get(lineKey);
    const position=text.indexOf(form,cursor);

    if(position!==-1){
      addFragment(lineKey,position,position+form.length,token);
      cursorByLine.set(lineKey,position+form.length);
      return;
    }

    // If the token is split at an editorial hyphen, match it against the
    // remaining text across subsequent lines. The matching stream omits only
    // a hyphen at the end of a source line; the rendered fragments retain it.
    let combined="";
    const mapping=[];
    for(let i=lineIndex;i<lines.length;i++){
      const key=String(lines[i].line);
      const startAt=(i===lineIndex)?(cursorByLine.get(key)||0):0;
      const source=textByLine.get(key);
      const endAt=(source.endsWith("-")?source.length-1:source.length);
      for(let offset=startAt;offset<endAt;offset++){
        combined+=source[offset];
        mapping.push({key,offset});
      }
    }

    const matchStart=combined.indexOf(form);
    if(matchStart!==-1){
      const match=mapping.slice(matchStart,matchStart+form.length);
      if(match.length===form.length){
        let groupStart=0;
        while(groupStart<match.length){
          const key=match[groupStart].key;
          let groupEnd=groupStart+1;
          while(groupEnd<match.length && match[groupEnd].key===key)groupEnd++;

          const firstOffset=match[groupStart].offset;
          const lastOffset=match[groupEnd-1].offset+1;
          addFragment(key,firstOffset,lastOffset,token);

          // If the matched token continues onto another source line and the
          // current source line ends in an editorial hyphen, include that
          // hyphen in the same interactive fragment.
          if(groupEnd<match.length){
            const source=textByLine.get(key);
            if(lastOffset===source.length-1 && source.endsWith("-")){
              addFragment(key,lastOffset,lastOffset+1,token);
            }
          }
          groupStart=groupEnd;
        }

        // Advance cursors to the end of each consumed fragment. This allows
        // subsequent tokens on later lines to align normally.
        let groupCursor=0;
        while(groupCursor<match.length){
          const key=match[groupCursor].key;
          let groupEnd=groupCursor+1;
          while(groupEnd<match.length && match[groupEnd].key===key)groupEnd++;
          let endOffset=match[groupEnd-1].offset+1;
          const source=textByLine.get(key);
          if(groupEnd<match.length && endOffset===source.length-1 && source.endsWith("-"))endOffset++;
          cursorByLine.set(key,endOffset);
          groupCursor=groupEnd;
        }
        return;
      }
    }

    console.warn("Token could not be aligned with source text",token.token_id,form,text);
  });

  return fragmentsByLine;
}

function renderLine(lineElement,text,fragments){
  let cursor=0;
  fragments.sort((a,b)=>a.start-b.start);
  fragments.forEach(fragment=>{
    if(fragment.start>cursor)lineElement.appendChild(document.createTextNode(text.slice(cursor,fragment.start)));
    lineElement.appendChild(makeTokenSpan(text.slice(fragment.start,fragment.end),fragment.token));
    cursor=Math.max(cursor,fragment.end);
  });
  if(cursor<text.length)lineElement.appendChild(document.createTextNode(text.slice(cursor)));
}

async function loadData(){
  const entries=await Promise.all(Object.entries(DATA_FILES).map(async([name,file])=>{
    const response=await fetch(file);
    if(!response.ok)throw new Error(`Could not load ${file} (${response.status})`);
    return[name,await response.json()];
  }));
  return Object.fromEntries(entries);
}

function selectedPassage(passages){
  const requested=new URLSearchParams(window.location.search).get("passage");
  const id=(requested||DEFAULT_PASSAGE_ID).trim();
  return passages.find(p=>p.passage_id===id)||passages.find(p=>p.passage_id===DEFAULT_PASSAGE_ID)||passages[0];
}

function render(data){
  const textLines=data.text.lines||[];
  const tokens=data.tokens||[];
  const speakers=data.speakers.speakers||[];
  const sections=data.sections.sections||[];
  const passages=data.passages.passages||[];
  const current=selectedPassage(passages);
  if(!current)throw new Error("No passages are available.");

  const start=String(current.line_start).trim(),end=String(current.line_end).trim();
  // bacchae-text.json is authoritative for the sequence and surface form.
  const lines=textLines.filter(line=>inRange(line.line,start,end));
  const fragmentsByLine=buildTokenFragments(lines,tokens.filter(token=>inRange(token.line,start,end)));

  // Speaker and section are determined from the first line of the selected passage.
  const speaker=findRangeRecord(speakers,start);
  const section=speaker?sections.find(s=>s.section_id===speaker.section_id):findRangeRecord(sections,start);

  document.querySelector(".section").textContent=section?.section||"";
  document.querySelector(".range").textContent=`Lines ${start}–${end}`;
  document.querySelector(".speaker").textContent=speaker?.speaker||"";
  document.body.dataset.passageId=current.passage_id;

  passage.replaceChildren();
  lines.forEach(line=>{
    const lineElement=document.createElement("div");
    lineElement.className="line";lineElement.dataset.line=line.line;
    const fragments=fragmentsByLine.get(String(line.line))||[];
    renderLine(lineElement,line.text||"",fragments);
    passage.appendChild(lineElement);
  });
}

document.getElementById("close").addEventListener("click",()=>{panel.classList.remove("open");panel.setAttribute("aria-hidden","true");document.querySelectorAll(".annotated").forEach(x=>x.classList.remove("annotated"))});
loadData().then(render).catch(error=>{console.error(error);passage.innerHTML='<div style="color:#900">Unable to load the Bacchae datasets.</div>'});
</script>
</body>
</html>
